<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToDoリスト</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    body {
      background-color: #e0f7fa;
      font-family: sans-serif;
    }

    .container {
  padding: 1rem;
  max-width: 100%; 
  width: 100%;     
  box-sizing: border-box; 
  margin: auto;
}


    input, button {
      padding: 0.5rem;
      border-radius: 0.25rem;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      cursor: pointer;
    }

    .category-box {
      border: 2px solid #333; /* ←濃い線 */
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .category-content {
      background-color: white; /* ←カテゴリ内を白に */
      padding: 1rem;
      border-radius: 0.5rem;
    }

    .task-item {
      background-color: #ffe4e6;
      border: 2px solid #555; /* ←濃い線 */
      border-radius: 0.25rem;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-done {
      background-color: #d0f0c0;
    }

    .flex {
      display: flex;
      gap: 0.5rem;
    }

    .justify-between {
      justify-content: space-between;
    }

    .text-blue {
      color: #2563eb;
    }

    .text-red {
      color: #dc2626;
    }

    .text-yellow {
      color: #ca8a04;
    }

    .text-gray {
      color: #4a4a4a;
    }

    .font-bold {
      font-weight: bold;
    }

    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .ml-auto { margin-left: auto; }
  </style>
</head>
<body>
  <div id="app" class="container">
    <h1 class="text-2xl font-bold mb-4"></h1>

    <div class="mb-4 flex">
      <input v-model="newCategory" placeholder="新しいカテゴリ" />
      <button @click="addCategory" style="background-color: #3b82f6; color: white;">追加</button>
    </div>

    <div v-for="(category, catIndex) in categories" :key="catIndex" class="category-box">
      <div class="category-content">
        <div class="flex justify-between mb-2">
          <h2 class="font-bold">{{ category.name }}</h2>
          <div class="flex">
            <button @click="toggleCategory(catIndex)" class="text-blue underline">
              {{ category.show ? '▼' : '表示' }}
            </button>
            <button @click="removeCategory(catIndex)" class="text-red underline">削除</button>
          </div>
        </div>

        <div v-if="category.show">
          <div class="flex mb-2">
            <input v-model="category.newTask" placeholder="やること/買うもの" />
            <button @click="addTask(catIndex)" style="background-color: #22c55e; color: white;">追加</button>
          </div>

          <div>
            <h3 class="font-bold text-gray mb-1">未実行</h3>
            <ul>
              <li v-for="(task, taskIndex) in category.tasks.filter(t => !t.done)" :key="taskIndex" class="task-item">
                <span>{{ task.text }}</span>
                <div class="flex ml-auto">
                  <button @click="toggleTask(catIndex, category.tasks.indexOf(task))" class="text-blue">実行</button>
                  <button @click="removeTask(catIndex, category.tasks.indexOf(task))" class="text-red">削除</button>
                </div>
              </li>
            </ul>
          </div>

          <div class="mt-4">
            <h3 class="font-bold text-gray mb-1">完了</h3>
            <ul>
              <li v-for="(task, taskIndex) in category.tasks.filter(t => t.done)" :key="taskIndex" class="task-item task-done">
                <span>{{ task.text }}</span>
                <div class="flex ml-auto">
                  <button @click="toggleTask(catIndex, category.tasks.indexOf(task))" class="text-yellow border px-2">戻す</button>
                  <button @click="removeTask(catIndex, category.tasks.indexOf(task))" class="text-red border px-2">削除</button>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, watch } = Vue

    createApp({
      setup() {
        const categories = ref([])


        const newCategory = ref('')

        if (localStorage.getItem('tasks')) {
          const saved = JSON.parse(localStorage.getItem('tasks'))
          saved.forEach(cat => cat.newTask = '')
          categories.value = saved
        }

        watch(
          categories,
          () => {
            localStorage.setItem('tasks', JSON.stringify(categories.value))
          },
          { deep: true }
        )

        const addCategory = () => {
          if (newCategory.value.trim()) {
            categories.value.push({ name: newCategory.value, tasks: [], show: true, newTask: '' })
            newCategory.value = ''
          }
        }

        const removeCategory = (index) => {
          categories.value.splice(index, 1)
        }

        const addTask = (catIndex) => {
          const taskText = categories.value[catIndex].newTask
          if (taskText.trim()) {
            categories.value[catIndex].tasks.push({ text: taskText, done: false, date: null })
            categories.value[catIndex].newTask = ''
          }
        }

        const toggleTask = (catIndex, taskIndex) => {
          const task = categories.value[catIndex].tasks[taskIndex]
          task.done = !task.done
          task.date = task.done ? new Date().toLocaleDateString() : null
        }

        const removeTask = (catIndex, taskIndex) => {
          categories.value[catIndex].tasks.splice(taskIndex, 1)
        }

        const toggleCategory = (index) => {
          categories.value[index].show = !categories.value[index].show
        }

        return {
          categories,
          newCategory,
          addCategory,
          removeCategory,
          addTask,
          toggleTask,
          removeTask,
          toggleCategory
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
